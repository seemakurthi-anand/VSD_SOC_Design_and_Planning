<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="100%" stop-color="#0f2436"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- circuit trace pattern -->
  <g stroke="#1e3a4f" stroke-width="2" fill="none" opacity="0.8">
    <path d="M0,40 H180 V90 H320"/>
    <path d="M0,220 H140 V170 H300 V190 H460"/>
    <path d="M1200,60 H1020 V20 H860"/>
    <path d="M1200,200 H1040 V240 H880 V210 H760"/>
    <path d="M60,0 V60 H140"/>
    <path d="M1150,0 V50"/>
    <path d="M40,260 V210"/>
  </g>
  <g fill="#2dd4bf" opacity="0.9">
    <circle cx="180" cy="40" r="3"/>
    <circle cx="320" cy="90" r="3"/>
    <circle cx="140" cy="220" r="3"/>
    <circle cx="460" cy="190" r="3"/>
    <circle cx="1020" cy="60" r="3"/>
    <circle cx="860" cy="20" r="3"/>
    <circle cx="1040" cy="200" r="3"/>
    <circle cx="760" cy="210" r="3"/>
  </g>

  <!-- chip icon -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="92" height="92" rx="6" fill="#0f2436" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="20" y="20" width="52" height="52" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <rect x="34" y="34" width="24" height="24" fill="#2dd4bf" opacity="0.85"/>
    <!-- pins -->
    <g stroke="url(#accent)" stroke-width="2.5">
      <line x1="14" y1="-10" x2="14" y2="0"/>
      <line x1="34" y1="-10" x2="34" y2="0"/>
      <line x1="58" y1="-10" x2="58" y2="0"/>
      <line x1="78" y1="-10" x2="78" y2="0"/>
      <line x1="14" y1="92" x2="14" y2="102"/>
      <line x1="34" y1="92" x2="34" y2="102"/>
      <line x1="58" y1="92" x2="58" y2="102"/>
      <line x1="78" y1="92" x2="78" y2="102"/>
      <line x1="-10" y1="14" x2="0" y2="14"/>
      <line x1="-10" y1="34" x2="0" y2="34"/>
      <line x1="-10" y1="58" x2="0" y2="58"/>
      <line x1="-10" y1="78" x2="0" y2="78"/>
      <line x1="92" y1="14" x2="102" y2="14"/>
      <line x1="92" y1="34" x2="102" y2="34"/>
      <line x1="92" y1="58" x2="102" y2="58"/>
      <line x1="92" y1="78" x2="102" y2="78"/>
    </g>
  </g>

  <!-- title text -->
  <text x="240" y="118" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#f1f5f9">VLSI SoC Design &amp; Planning</text>
  <text x="240" y="150" font-family="Verdana, Geneva, sans-serif" font-size="17" fill="#7dd3fc">RTL to GDSII Physical Design Flow · Open-Source EDA (OpenLane · Sky130)</text>

  <!-- bottom accent line -->
  <rect x="240" y="168" width="360" height="4" rx="2" fill="url(#accent)"/>
</svg>
